name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install, test and build
        shell: cmd
        run: build_windows.bat --ci
      - name: Upload complete application folder
        uses: actions/upload-artifact@v4
        with:
          name: FNAFDesktop-Windows
          path: dist/FNAFDesktop/
          if-no-files-found: error
